# =====================================================================
# 开发环境基础设施：docker compose up -d 会启动 postgres / redis / kafka
# 完整部署（含前后端应用）：docker compose --profile app up -d --build
# =====================================================================

services:
  # ---------- 基础设施（开发时只启动这三个） ----------
  postgres:
    image: postgres:16-alpine
    container_name: demo-postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Kafka 单机 KRaft 模式（官方 apache/kafka 镜像，无需 Zookeeper）
  # 注意：bitnami/kafka:3.7 已从 Docker Hub 下架，官方 apache 镜像的环境变量名不同（无 CFG 后缀）
  kafka:
    image: apache/kafka:3.7.1
    container_name: demo-kafka
    ports:
      - "9092:9092"
      # 宿主机访问走 29092（应用在容器网络内走 9092）
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # 容器内用 kafka:9092，宿主机（本机跑 Spring Boot 开发）用 localhost:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------- 应用（--profile app 时才启动，用于体验完整部署） ----------
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: demo-backend
    environment:
      # 覆盖 application.yml：容器网络里用服务名而不是 localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: demo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  redis_data:
  kafka_data:
